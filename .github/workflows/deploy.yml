name: Deploy and Sync

on:
  # 代码推送时触发
  push:
    branches: [ main, master ]

  # 手动触发
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
        - development
        - staging
        - production

  # 定时同步
  schedule:
    - cron: '0 */6 * * *'  # 每6小时同步一次

# 权限设置
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: 安装依赖
      run: npm ci

    - name: 运行测试
      run: npm test

    - name: 代码检查
      run: npm run lint || echo "Linting skipped"

  deploy:
    name: 部署
    runs-on: ubuntu-latest
    needs: test
    if: success()

    steps:
    - name: 检出代码
      uses: actions/checkout@v3

    - name: 设置 Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: 安装依赖
      run: npm ci --only=production

    - name: 部署到服务器
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        SERVER_HOST: ${{ secrets.SERVER_HOST }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        # 创建 SSH 密钥文件
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # 添加到 known_hosts
        ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts
        
        # 执行部署脚本
        ssh $SERVER_USER@$SERVER_HOST "
          cd /var/www/cozeli
          git pull origin main
          npm install --production
          pm2 restart cozeli-sync || pm2 start src/index.js --name cozeli-sync
          echo '🚀 部署完成！'
        "

    - name: 触发 Coze 工作流
      env:
        COZE_API_KEY: ${{ secrets.COCZE_API_KEY }}
        COZE_BOT_ID: ${{ secrets.COCZE_BOT_ID }}
      run: |
        curl -X POST https://api.coze.com/v1/workflow/trigger \
          -H "Authorization: Bearer $COZE_API_KEY" \
          -H "Content-Type: application/json" \
          -d '{
            "bot_id": "$COZE_BOT_ID",
            "event_type": "github_deployment",
            "data": {
              "repository": "${{ github.repository }}",
              "branch": "${{ github.ref_name }}",
              "commit": "${{ github.sha }}",
              "deployer": "${{ github.actor }}",
              "environment": "${{ github.event.inputs.environment || 'production' }}"
            }
          }'

  sync-to-coze:
    name: 同步到 Coze
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
    - name: 同步 Issues
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COZE_API_KEY: ${{ secrets.COCZE_API_KEY }}
      run: |
        # 使用 Node.js 脚本同步数据
        node scripts/sync-issues.js
        node scripts/sync-pull-requests.js
        echo '✅ 数据同步完成'

    - name: 发送通知
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: `同步报告 - ${new Date().toISOString()}`,
            body: `GitHub 到 Coze 同步已完成。
            
            **状态**: ${{ job.status }}
            **触发者**: @${{ github.actor }}
            **时间**: ${new Date().toISOString()}
            
            查看详情：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
          })